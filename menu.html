        <h3>Paneer Curry</h3>

    </div>
    <div class="menu-card">
        <img src="../images/veg-meals.jpg">

<section class="order-form">
    <h2>Place Your Order</h2>

    <form id="order-form">
        <input
            type="text"
            id="food-name"
            placeholder="Selected Food"
            required
            readonly
        >
        <input
            type="text"
            id="customer-name"
            placeholder="Your Name"
            required
        >
        <input
            type="number"
            id="quantity"
            placeholder="Quantity"
            min="1"
            step="1"
            required
        >
        <button type="submit">Confirm Order</button>
        <p id="order-status" aria-live="polite"></p>
    </form>
</section>
<script src="../Javascript/menu.js"></script>
