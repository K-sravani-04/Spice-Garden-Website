<section class="contact">
  <h1>Contact Us</h1>
  <p class="sub-title">We would love to hear from you!</p>

  <div class="contact-container">
    <div class="contact-info">
      <h3>Get in Touch</h3>
      <p>📍 Tirupati, AP</p>
      <p>📞 +91 98765 43210</p>
      <p>✉️ hello@foodstory.com</p>
      <p>⏰ 11 AM - 11 PM (All Days)</p>
    </div>

    <div class="contact-form">
      
<div class="contact-form">
    
<div class="contact-form">
    <form id="contact-form">

        <input
            type="text"
            id="user-name"
            name="name"
            placeholder="Your Name"
            required
        >

        <input
            type="email"
            id="user-email"
            name="email"
            placeholder="Your Email"
            required
        >

        <textarea
            id="user-message"
            name="message"
            rows="4"
            placeholder="Your Message"
            required
        ></textarea>

        <button type="submit">Send Message</button>

        <p id="form-status" aria-live="polite"></p>

    </form>
</div>
</section>
<script src="../Javascript/contact.js"></script>
